name: 审计申请
description: 申请网站转化或增长审计。
title: "审计申请：[公司或网站名称]"
labels: ["audit-request", "zh"]
body:
  - type: markdown
    attributes:
      value: |
        提交后我们会确认范围、报价和交付时间。请勿在表单中发送密码或敏感账号信息。
  - type: dropdown
    id: package
    attributes:
      label: 选择套餐
      options:
        - AI 工作流修复 — ¥680
        - Quick Audit 快速审计 — ¥1,080
        - Growth Audit 增长审计 — ¥2,880
        - Implementation Sprint 实施冲刺 — ¥7,180
        - 不确定，请帮我推荐
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: 网站地址
      description: 必须是你拥有或已获得授权审查的网站。
      placeholder: https://example.com
    validations:
      required: true
  - type: input
    id: company
    attributes:
      label: 公司或产品名称
    validations:
      required: true
  - type: input
    id: audience
    attributes:
      label: 目标客户
      description: 你希望谁购买或注册？
      placeholder: 例如：跨境电商运营负责人
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 主要转化目标
      description: 希望访客完成什么动作？
      placeholder: 例如：预约演示 / 开始试用 / 直接购买
    validations:
      required: true
  - type: textarea
    id: traffic
    attributes:
      label: 流量情况
      description: 可填写大概月访问量和主要来源。
      placeholder: 例如：每月约 2000；自然搜索和微信。
    validations:
      required: false
  - type: textarea
    id: issues
    attributes:
      label: 已知问题或想解决的问题
    validations:
      required: false
  - type: textarea
    id: payment
    attributes:
      label: 支付方式
      description: 可选择支付宝或微信支付，确认订单后我们会发送收款信息。
    validations:
      required: false
  - type: checkboxes
    id: authorization
    attributes:
      label: 授权与条款
      options:
        - label: 我拥有该网站或已获得审查授权。
          required: true
        - label: 我理解审计只提供分析与建议，不保证收入。
          required: true
        - label: 我理解付款完成后才开始交付。
          required: true
