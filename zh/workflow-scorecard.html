<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 工作流体检 — 60 秒找出最值得先修的重复流程</title>
  <meta name="description" content="用 8 个问题判断哪个重复流程最值得先做 AI 工作流修复，并生成一份可发送的体检结果。">
  <style>
    :root { color-scheme: light; --ink:#101828; --muted:#5c6473; --brand:#1f5eff; --soft:#f5f7fa; --line:#dfe3ea; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:#fff; line-height:1.65; }
    .wrap { width:min(900px,calc(100% - 40px)); margin:0 auto; }
    header { border-bottom:1px solid var(--line); padding:22px 0; }
    .brand { font-weight:800; color:var(--ink); text-decoration:none; }
    h1 { font-size:clamp(30px,5vw,46px); letter-spacing:-.03em; line-height:1.1; margin:36px 0 12px; }
    .lede { color:var(--muted); font-size:18px; max-width:760px; }
    form { margin:32px 0; }
    .question { border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:14px; }
    label { display:block; font-weight:700; margin-bottom:8px; }
    select,textarea,input { width:100%; min-height:44px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font:inherit; }
    textarea { min-height:90px; }
    .btn { display:inline-block; background:var(--brand); color:#fff; padding:12px 20px; border-radius:10px; text-decoration:none; font-weight:700; border:0; cursor:pointer; }
    .btn.secondary { background:#fff; color:var(--ink); border:1px solid var(--line); }
    .result { border:1px solid var(--line); border-radius:16px; padding:24px; background:var(--soft); display:none; }
    .score { font-size:44px; font-weight:850; margin:0 0 4px; }
    .muted { color:var(--muted); }
    footer { border-top:1px solid var(--line); color:var(--muted); padding:24px 0; margin-top:40px; font-size:14px; }
    @media(max-width:720px){ .wrap{width:calc(100% - 32px);} }
  </style>
</head>
<body>
  <header><div class="wrap"><a class="brand" href="./">GrowthAudit</a></div></header>
  <main class="wrap">
    <h1>AI 工作流体检</h1>
    <p class="lede">回答 8 个问题，找出团队里最值得先修的一个重复流程。结果会生成一份简短说明，方便你发给同事确认。</p>

    <form id="scorecard">
      <div class="question"><label for="process">1. 最想先修的流程是什么？</label><input id="process" required placeholder="例如：客户素材收集与整理"></div>
      <div class="question"><label for="hours">2. 这件事每周大约消耗多少人工时间？</label>
        <select id="hours" required><option value="1">1–2 小时</option><option value="2">3–5 小时</option><option value="4">6–10 小时</option><option value="7">10 小时以上</option></select>
      </div>
      <div class="question"><label for="people">3. 有多少人参与这个流程？</label>
        <select id="people" required><option value="1">1 人</option><option value="3">2–4 人</option><option value="5">5–9 人</option><option value="8">10 人以上</option></select>
      </div>
      <div class="question"><label for="tools">4. 流程中主要使用多少个工具？</label>
        <select id="tools" required><option value="1">1 个</option><option value="3">2–3 个</option><option value="6">4–6 个</option><option value="9">7 个以上</option></select>
      </div>
      <div class="question"><label for="handoffs">5. 有多少次人工交接？</label>
        <select id="handoffs" required><option value="1">基本没有</option><option value="3">1–2 次</option><option value="6">3–5 次</option><option value="9">6 次以上</option></select>
      </div>
      <div class="question"><label for="repetition">6. 相同步骤每周重复多少次？</label>
        <select id="repetition" required><option value="1">少于 5 次</option><option value="3">5–20 次</option><option value="6">21–50 次</option><option value="9">50 次以上</option></select>
      </div>
      <div class="question"><label for="errors">7. 最近一个月出现过多少次遗漏或返工？</label>
        <select id="errors" required><option value="0">基本没有</option><option value="2">1–3 次</option><option value="5">4–10 次</option><option value="8">10 次以上</option></select>
      </div>
      <div class="question"><label for="pain">8. 现在最卡的一步是什么？</label><textarea id="pain" required placeholder="例如：客户发来的素材散落在微信和网盘里，没人确认是否齐全。"></textarea></div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;"><button class="btn" type="submit">生成体检结果</button><button class="btn secondary" type="reset">重填</button></div>
    </form>

    <div class="result" id="result">
      <p class="muted">体检结果</p>
      <p class="score" id="score">0</p>
      <p class="muted" id="verdict"></p>
      <h2>建议先修三步</h2>
      <ol id="steps"></ol>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:20px;">
        <a class="btn" id="apply-link" href="automation-fix.html">申请 ¥680 工作流诊断</a>
        <a class="btn secondary" id="mailto-link" href="#">把结果发给顾问</a>
      </div>
    </div>
  </main>
  <footer><div class="wrap">© 2026 GrowthAudit。工具只在浏览器内运行，不上传数据。结果仅用于诊断，不承诺收入。</div></footer>

  <script>
    document.getElementById('scorecard').addEventListener('submit', event => {
      event.preventDefault();
      const value = id => document.getElementById(id).value.trim();
      const numeric = id => Number(document.getElementById(id).value || 0);
      const score = ['hours','people','tools','handoffs','repetition','errors'].reduce((sum,id) => sum + numeric(id), 0);
      const verdict = score >= 26 ? '高优先级：这个流程每周消耗的协调成本明显偏高，建议先做一次 48 小时工作流诊断。' :
        score >= 15 ? '中优先级：值得先修。建议聚焦最卡的一步，不要一开始就自动化整个流程。' :
        '低优先级：可以先保留，但建议把关键步骤记录下来，等重复次数增加后再修。';
      const steps = [
        `把“${value('process')}”拆成触发、输入、处理、审批、交付五个阶段。`,
        `先解决这一步：${value('pain')}。`,
        '给每个阶段确定负责人、工具、完成标准和异常处理方式。'
      ];
      document.getElementById('score').textContent = score + ' / 44';
      document.getElementById('verdict').textContent = verdict;
      document.getElementById('steps').innerHTML = steps.map(item => `<li>${item}</li>`).join('');
      const summary = [
        `流程：${value('process')}`,
        `每周人工时间：${document.getElementById('hours').selectedOptions[0].textContent}`,
        `参与人数：${document.getElementById('people').selectedOptions[0].textContent}`,
        `工具数量：${document.getElementById('tools').selectedOptions[0].textContent}`,
        `人工交接：${document.getElementById('handoffs').selectedOptions[0].textContent}`,
        `每周重复次数：${document.getElementById('repetition').selectedOptions[0].textContent}`,
        `最近一个月遗漏/返工：${document.getElementById('errors').selectedOptions[0].textContent}`,
        `最卡的一步：${value('pain')}`,
        `体检得分：${score} / 44`,
        verdict
      ].join('\n');
      document.getElementById('mailto-link').href = 'mailto:hailong.wei@ushow.media?subject=' + encodeURIComponent('AI 工作流体检结果') + '&body=' + encodeURIComponent(summary);
      const params = new URLSearchParams({ package: 'AI 工作流修复 ¥680', context: summary });
      document.getElementById('apply-link').href = 'apply.html?' + params.toString();
      document.getElementById('result').style.display = 'block';
      document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
    });
  </script>
</body>
</html>
