<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>申请 AI 增长审计</title>
  <meta name="description" content="提交网站、目标和客户画像，申请 48 小时 AI 增长审计。">
  <style>
    :root { color-scheme: light; --ink:#101828; --muted:#5c6473; --brand:#1f5eff; --soft:#f5f7fa; --line:#dfe3ea; }
    body { margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:#fff; line-height:1.65; }
    .wrap { width:min(880px,calc(100% - 40px)); margin:0 auto; }
    header { border-bottom:1px solid var(--line); padding:22px 0; }
    .brand { font-weight:800; color:var(--ink); text-decoration:none; }
    h1 { font-size:clamp(32px,5vw,48px); letter-spacing:-.02em; margin:36px 0 12px; }
    .lede { color:var(--muted); font-size:18px; max-width:720px; }
    form { display:grid; gap:14px; margin:34px 0; }
    label { font-weight:700; font-size:14px; }
    input,textarea,select { width:100%; min-height:44px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font:inherit; background:#fff; }
    textarea { min-height:110px; }
    .hint { color:var(--muted); font-size:13px; margin-top:6px; }
    .actions { display:flex; gap:12px; flex-wrap:wrap; margin-top:10px; }
    .btn { display:inline-block; background:var(--brand); color:#fff; padding:12px 20px; border-radius:10px; text-decoration:none; font-weight:700; border:0; cursor:pointer; }
    .btn.secondary { background:#fff; color:var(--ink); border:1px solid var(--line); }
    .note { background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:16px; color:var(--muted); font-size:14px; }
    footer { border-top:1px solid var(--line); color:var(--muted); padding:24px 0; margin-top:50px; font-size:14px; }
  </style>
</head>
<body>
  <header><div class="wrap"><a class="brand" href="/">GrowthAudit</a></div></header>
  <main class="wrap">
    <h1>申请审计</h1>
    <p class="lede">填写下面的信息，我会先判断是否适合，再确认范围、价格和交付时间。</p>

    <form id="audit-form">
      <div>
        <label for="name">称呼</label>
        <input id="name" name="name" placeholder="例如：李先生 / Wei" required>
      </div>
      <div>
        <label for="company">公司或产品</label>
        <input id="company" name="company" placeholder="例如：Ushow Media" required>
      </div>
      <div>
        <label for="website">网站链接</label>
        <input id="website" name="website" type="url" placeholder="https://example.com" required>
        <div class="hint">必须是你拥有或已获得授权审查的网站。</div>
      </div>
      <div>
        <label for="audience">目标客户</label>
        <input id="audience" name="audience" placeholder="例如：跨境电商运营负责人" required>
      </div>
      <div>
        <label for="goal">主要转化目标</label>
        <input id="goal" name="goal" placeholder="例如：预约演示 / 开始试用 / 直接下单" required>
      </div>
      <div>
        <label for="package">选择套餐</label>
        <select id="package" name="package">
          <option value="AI 工作流修复 ¥680">AI 工作流修复 ¥680</option>
          <option value="快速审计 ¥1,080">快速审计 ¥1,080</option>
          <option value="增长审计 ¥2,880">增长审计 ¥2,880</option>
          <option value="实施冲刺 ¥7,180">实施冲刺 ¥7,180</option>
          <option value="不确定，请帮我推荐">不确定，请帮我推荐</option>
        </select>
      </div>
      <div>
        <label for="context">流量来源 / 已知问题</label>
        <textarea id="context" name="context" placeholder="例如：每月约 2000 访问，主要来自自然搜索和微信；用户到价格页后流失。"></textarea>
      </div>
      <div class="actions">
        <button class="btn" type="submit">生成申请邮件</button>
        <a class="btn secondary" href="https://github.com/newworldba/ai-growth-audit/issues/new?template=audit-request-zh.yml">用 GitHub 提交</a>
        <a class="btn secondary" href="payment.html">查看支付方式</a>
      </div>
    </form>

    <div class="note">请勿在表单或邮件中发送密码、支付密码、身份证号、银行卡号或其他敏感信息。付款完成后才开始交付。</div>
  </main>
  <footer><div class="wrap">© 2026 GrowthAudit。仅提供分析与建议，不保证收入。</div></footer>
  <script>
    const packageSelect = document.getElementById('package');
    const requestParams = new URLSearchParams(location.search);
    const requestedPackage = requestParams.get('package');
    if (requestedPackage) packageSelect.value = requestedPackage;
    ['website', 'audience', 'goal', 'context'].forEach(id => {
      const value = requestParams.get(id);
      if (value) document.getElementById(id).value = value;
    });

    document.getElementById('audit-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const data = new FormData(event.target);
      const lines = [
        `称呼：${data.get('name')}`,
        `公司/产品：${data.get('company')}`,
        `网站：${data.get('website')}`,
        `目标客户：${data.get('audience')}`,
        `主要转化目标：${data.get('goal')}`,
        `套餐：${data.get('package')}`,
        `流量来源/已知问题：${data.get('context') || '未填写'}`,
        '我确认我拥有该网站或已获得审查授权。'
      ];
      const subject = `审计申请：${data.get('company')}`;
      const body = encodeURIComponent(lines.join('\n'));
      window.location.href = `mailto:hailong.wei@ushow.media?subject=${encodeURIComponent(subject)}&body=${body}`;
    });
  </script>
</body>
</html>
